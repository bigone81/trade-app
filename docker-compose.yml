services:
  app:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_PATH: /data/trade.sqlite
      CHARTS_DIR: /data/charts
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - trade_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_PATH: /data/trade.sqlite
      CHARTS_DIR: /data/charts
    volumes:
      - trade_data:/data
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

volumes:
  trade_data:
